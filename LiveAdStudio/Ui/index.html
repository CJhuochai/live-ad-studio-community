function trendCard(){const a=(S.chartSnapshots||[]).slice(-12);let chart='';if(a.length){const max=Math.max(1,...a.map(x=>x.spend));const points=a.map((q,i)=>[38+i*430/Math.max(1,a.length-1),112-q.spend/max*88]);let d=points.map(p=>p.join(',')).join(' ');chart='<svg class="chart" viewBox="0 0 500 140"><defs><linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#d4c9ff" stop-opacity=".6"/><stop offset="1" stop-color="#fefeff"/></linearGradient></defs><path d="M38 24H478 M38 68H478 M38 112H478" stroke="#f0f0f7"/><polygon points="38,112 '+d+' '+points.at(-1)[0]+',112" fill="url(#fade)"/><polyline points="'+d+'" stroke="#9a85ec" stroke-width="2" fill="none"/>'+points.map(p=>'<circle cx="'+p[0]+'" cy="'+p[1]+'" r="3" fill="#a08aee"/>').join('')+'<text x="38" y="134">'+dt(a[0].at)+'</text><text x="397" y="134">'+dt(a.at(-1).at)+'</text><text x="2" y="29">'+num(max,0)+'</text><text x="13" y="116">0</text></svg>'}else chart='<div class="empty">'+icon('chart')+'还没有快照<br><span style="font-size:10px">手动记录或确认截图数字后，趋势会出现在这里</span></div>';return '<div class="card"><div class="cardtop"><h2>消耗变化</h2><span class="small">已确认数据 · 累计值</span></div><div class="body" style="padding-top:0">'+chart+'</div></div>'}

function field(label,id,value='',type='text',full=false){return '<div class="field '+(full?'full':'')+'"><label for="f_'+id+'">'+label+'</label><input id="f_'+id+'" type="'+type+'" value="'+esc(value??'')+'" '+(type==='number'?'min="0" step="any"':'')+'></div>'}function val(id){return document.getElementById('f_'+id).value.trim()}function nullable(id){const t=val(id);if(t==='')return null;const n=Number(t);if(!Number.isFinite(n)||n<0)throw Error('请填写有效的非负数值');return n}function attempt(fn){try{fn()}catch(e){toast(e.message,true)}}
function openSettings(){if(!S)return;const f=S.finance,c=S.config;let body='<div class="formnote">未知成本留空，不要填0。新场次可先只填名称、商品和投放目标。</div><div class="formgrid">'+field('场次名称','name',f.name)+field('场次归属日期','day',f.day?.slice(0,10),'date')+field('商家 / 直播账号','account',f.account)+field('主推商品关键词','product',f.product)+'<div class="field"><label>投放目标</label><select id="f_goal"><option '+(f.goal==='成交金额'?'selected':'')+'>成交金额</option><option '+(f.goal==='成单人数'?'selected':'')+'>成单人数</option></select></div>'+field('当前成本目标或 ROI 目标','target',f.target,'number')+field('日预算（元）','budget',f.budget,'number')+field('最大可承受试错投入（元）','lossLimit',f.lossLimit,'number')+'</div><div class="formsection">商品经济账 · 可稍后补充</div><div class="formgrid">'+field('主推成交价（元）','price',f.price,'number')+field('平台费率（%）','feeRate',f.feeRate,'number')+field('保留订单的直接服务成本（元）','directCost',f.directCost,'number')+field('预计最终订单保留率（%）','retention',f.retention,'number')+field('每笔支付订单希望留下贡献（元）','desiredProfit',f.desiredProfit,'number')+field('样本提醒订单数','sampleMin',f.sampleMin,'number')+'</div><div class="formsection">盯盘节奏与统计范围</div><div class="formgrid">'+field('截图采集间隔（秒，至少15）','captureSeconds',c.captureSeconds,'number')+field('AI分析间隔（分钟）','analysisMinutes',c.analysisMinutes,'number')+field('本场最大请求次数','requestLimit',c.requestLimit,'number')+field('备注','notes',f.notes)+field('订单统计开始（可留空）','start',f.start?.slice(0,16),'datetime-local')+field('订单统计结束（不含结束时刻）','end',f.end?.slice(0,16),'datetime-local')+'</div><div class="formnote">起止留空按自然日统计。跨零点直播请填写完整范围。设置更新后，盯盘会暂停以便你重新确认。</div>';showModal('设置这场直播',body,()=>attempt(()=>{const finance={...f};for(const k of ['name','account','product','goal','notes'])finance[k]=val(k);for(const k of ['price','feeRate','directCost','retention','desiredProfit','budget','target','lossLimit','sampleMin'])finance[k]=nullable(k);finance.desiredProfit??=0;finance.sampleMin??=10;finance.day=val('day')+'T00:00:00';finance.start=val('start')||null;finance.end=val('end')||null;submitDialog('settings',{finance,captureSeconds:nullable('captureSeconds'),analysisMinutes:nullable('analysisMinutes'),requestLimit:nullable('requestLimit')})}))}
function openSnapshot(ocr, imported=null) {
  if (!S) return;
  const image = imported || (ocr ? S.capture : null);
  const c = image?.candidates || {};
  const time = localTime();
  const scope = S.scope;
  const body = '<div class="formnote">填写后台累计值。记录时间默认 '+esc(time.replace('T',' '))+'。'
    + (ocr ? '请逐项对照截图。' : '') + '</div><div class="formgrid">'
    + field('累计消耗（元）*','spend',c['消耗'],'number')
    + field('累计全域 GMV（元）*','gmv',c['GMV'],'number')
    + field('累计成单人数 *','buyers',c['人数'],'number')
    + '</div><details class="subform"><summary>修改记录时间或补充其他指标</summary><div class="formgrid">'
    + field('记录时间','at',time,'datetime-local')
    + field('累计支付订单数','orders',c['订单'],'number')
    + field('同批订单退款金额','refund',c['退款'],'number')
    + field('累计进房人数','visits',c['进房'],'number')
    + field('累计商品点击人数','clicks',c['点击'],'number')
    + field('有效预约人数','appointments','','number')
    + field('备注','note') + '</div></details>'
    + (scope?.account && scope?.planId ? checkField('snapshotScope','已核对账号 '+scope.account+'、计划 '+scope.planId+'、统计范围 '+dt(scope.start)+' 至 '+dt(scope.end),false) : '<div class="small">设置账号和计划后可确认对账口径。</div>')
    + (ocr ? '<div class="formnote"><label><input type="checkbox" id="ocrConfirmed"> 我已核对截图所属计划、统计范围、记录时间和各项数字</label></div>'
      + '<details><summary class="small">查看识别原文</summary><div class="know">'+esc(image?.raw || '')+'</div></details>' : '');
  showModal('记录累计快照', body, () => attempt(() => {
    const q = {at:val('at'), source:ocr?'截图核对':'手动', note:val('note')};
    for (const k of ['spend','gmv','buyers','orders','refund','visits','clicks','appointments']) q[k]=nullable(k);
    if (q.spend===null||q.gmv===null||q.buyers===null) throw Error('消耗、GMV和人数必填，无成交请核实后填0');
    for (const k of ['buyers','orders','visits','clicks','appointments'])
      if (q[k]!==null&&!Number.isInteger(q[k])) throw Error('人数与订单数应填写整数');
    const confirmed = !ocr || document.getElementById('ocrConfirmed').checked;
    if (!confirmed) throw Error('请先核对截图数据');
    submitDialog('snapshot',{snapshot:q,confirmed,scopeConfirmed:document.getElementById('f_snapshotScope')?.checked===true});
  }));
}
